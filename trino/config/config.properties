# Trino de un solo nodo (coordinador + worker)
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Memoria: el heap es de 2 GB (jvm.config). La réplica de Gold hace un join de ~9,7 M votos
# con ~2 M posts, así que se da 1 GB por consulta y se permite derramar a disco (spill).
query.max-memory=1GB
query.max-memory-per-node=1GB
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
